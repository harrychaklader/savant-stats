    display_name: Swing Path & Attack Angle
    category: Batting
    available_since: 2023
    description: "Swing path tilt and attack angle leaderboard"
    params:
      season:
        type: array
        format: "season[]=2026"
      type:
        options: [batter, pitcher]
      split:
        description: "pitch type group split (e.g. api_pitch_type_group03)"

  swing_timing_miss_distance:
