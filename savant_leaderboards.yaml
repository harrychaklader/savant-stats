    params:
      year:
        type: integer
        required: true
      type:
        options: [Fielder]
        default: Fielder
      csv:
        options: [true, false]

  pop_time:
    path: poptime
    display_name: Catcher Pop Time
    category: Catching
    available_since: 2017
    description: "Catcher pop time on stolen base attempts"
    params:
      year:
        type: integer
