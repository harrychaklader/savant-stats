        options: [true, false]

  custom:
    path: custom
    display_name: Custom Leaderboard
    category: Batting / Pitching
    available_since: 2020
    description: "Custom leaderboard builder"
    params:
      year:
        type: integer
        required: true
      type:
        options: [batter, pitcher]
        default: batter
      selections:
        description: "comma-separated list of metrics to show"
      filter:
        description: "filter expression"
      min_:
        options: [q]
        default: q
      sort:
        description: "sort column"
      sort_dir:
        options: [desc, asc]
        default: desc
      csv:
        options: [false, true]
        default: false

  batting_stance:
    path: visuals/batting-stance
    display_name: Batting Stance
    category: Visual
    available_since: 2020
    description: "Batting stance visualization"
    format: HTML

  swing_path_attack_angle:
