      csv:
        options: [true, false]

  home_runs:
    path: home-runs
    display_name: Home Runs
    category: Batting
    available_since: 2015
    description: "Home run leaderboard with exit velocity, distance, launch angle"
    params:
      year:
        type: integer
        required: true
      type:
        options: [batter, hitter, Pitcher]
        default: batter
      csv:
        options: [true, false]

  swing_take:
    path: swing-take
    display_name: Run Value
    category: Batting / Pitching
    available_since: 2020
    description: "Run value of swings vs takes"
    params:
      year:
        type: integer
        required: true
      type:
        options: [All]
        default: All
      team:
        description: "3-letter team abbreviation"
      group:
        options: [Pitcher, Batter]
        default: Batter
      min:
        options: [q]
        default: q
      csv:
        options: [true, false]

  year_to_year:
    path: statcast-year-to-year
    display_name: Year-to-Year Changes
    category: Batting / Pitching
    available_since: 2015
    description: "Year-over-year changes in Statcast metrics"
    params:
      year:
        type: integer
        required: true
      group:
        options: [Pitcher, Batter]
        default: Batter
      csv:
        options: [true, false]

  park_factors:
    path: statcast-park-factors
    display_name: Statcast Park Factors
    category: League
    available_since: 2015
    description: "Park factors based on Statcast batted ball data"
    params:
      year:
        type: integer
        required: true
      csv:
        options: [true, false]

  pitcher_running_game:
    path: pitcher-running-game
    display_name: Pitcher Running Game
    category: Pitching
    available_since: 2017
    description: "Baserunner prevention - stolen bases allowed, pickoffs, primary lead"
    params:
      year:
        type: integer
        required: true
      csv:
        options: [true, false]

  timeout_infractions:
    path: pitch-timer-infractions
    display_name: Pitch Timer Infractions
