common_params:
  year:
    type: integer
    description: "Season year (2015-2026 for most leaderboards)"
  type:
    type: string
    description: "player type - batter/pitcher/fielder (leaderboard-specific)"
  team:
    type: string
    description: "3-letter team abbreviation (ATL, BOS, NYY, etc.) or empty for all"
  min:
    type: string | integer
    description: "minimum qualifier - 'q' for qualified or a number"
  csv:
    type: boolean
    description: "append &csv=true to download CSV instead of HTML"
    default: false

valid_team_abbreviations:
  - ARI
  - ATL
  - BAL
  - BOS
  - CHC
  - CIN
  - CLE
  - COL
  - CWS
  - DET
  - HOU
  - KC
